name: i7803 dump
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out
          printf '%s' "$ACCOUNTS_JSON" > out/ACCOUNTS_JSON
          printf '%s' "$TELEGRAM_BOT_TOKEN" > out/TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" > out/TELEGRAM_CHAT_ID
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: out/
          retention-days: 1